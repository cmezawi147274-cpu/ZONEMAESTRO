name: cmmp

# ==============================================================================
# Cloud Music Management Portal — the cloud half of the system.
#
# Everything here runs on Linux (targeted at Ubuntu Server 26.04 LTS). The
# Windows MusicServer agents at each restaurant are *clients* of the backend
# below, over outbound HTTPS only — nothing in this file runs on Windows.
#
#   Portal only, mock data, no backend or database needed:
#     docker compose up -d --build
#
#   The real cloud (portal + backend + Postgres), which is what a production
#   deployment runs:
#     docker compose --profile full up -d --build
#     docker compose --profile migrate run --rm backend-migrate
#
# Set NEXT_PUBLIC_USE_MOCK_API=false in .env for the `full` profile, so the
# portal talks to the backend instead of its in-browser mock data.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        BACKEND_INTERNAL_URL: http://backend:4000
    image: cmmp-portal:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- The real cloud backend -------------------------------------------------
  # REST API + socket.io realtime gateway + the Windows MusicServer agent
  # protocol (pairing, heartbeat, command delivery, music sync), all on one
  # service. Uploaded audio is served from the music volume at /media/music.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cmmp-backend:latest
    profiles: ["full"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://cmmp:${POSTGRES_PASSWORD:-cmmp}@postgres:5432/cmmp?schema=public}
      MUSIC_STORAGE_DIR: /app/data/music
    volumes:
      - music-data:/app/data/music
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot migration/seed runner. Uses the backend image's `builder` stage
  # because that is where the Prisma CLI lives — the runtime image ships no
  # dev dependencies.
  #   docker compose --profile migrate run --rm backend-migrate
  #   docker compose --profile migrate run --rm backend-migrate npm run db:seed
  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cmmp:${POSTGRES_PASSWORD:-cmmp}@postgres:5432/cmmp?schema=public}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    profiles: ["full", "migrate"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmmp}
      POSTGRES_USER: ${POSTGRES_USER:-cmmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cmmp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  music-data:
