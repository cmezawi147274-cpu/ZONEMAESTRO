<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZoneMaestro — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #5ec8f7;
      --accent-hover: #7ad4f9;
      --ink: #0b0d10;
      --shell: #101215;
      --line: rgba(255, 255, 255, 0.08);
      --muted: rgba(255, 255, 255, 0.58);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      background: var(--ink);
      color: #f4f6f8;
      color-scheme: dark;
    }
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(360px, 420px);
      min-height: 100vh;
    }
    .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        url("zonemaestro-venue-bg.png") center / cover no-repeat,
        #0a0c10;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(11, 13, 16, 0.16) 0%, rgba(11, 13, 16, 0.58) 82%, #0b0d10 100%),
        linear-gradient(180deg, rgba(11, 13, 16, 0.22) 0%, transparent 32%, rgba(11, 13, 16, 0.48) 100%);
      pointer-events: none;
    }
    .hero-copy {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 36px 48px 40px;
      pointer-events: none;
    }
    .hero-copy .lede { pointer-events: auto; }
    .logo {
      position: absolute;
      top: 28px;
      left: 40px;
      z-index: 2;
      width: min(268px, 34vw);
      height: auto;
      display: block;
      pointer-events: none;
    }
    .lede {
      max-width: 34rem;
      margin-top: auto;
    }
    h1 {
      font-size: clamp(2.4rem, 4.6vw, 3.65rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.04;
      text-wrap: balance;
    }
    .sub {
      margin-top: 16px;
      max-width: 28rem;
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      text-wrap: pretty;
    }
    .zones {
      display: flex;
      gap: 22px;
      margin-top: 36px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.48);
    }
    .zones b {
      color: rgba(255, 255, 255, 0.86);
      font-weight: 500;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 7px;
      background: #5ee9a8;
      box-shadow: 0 0 0 3px rgba(94, 233, 168, 0.16);
    }
    .dot.hold { background: #f5c36a; box-shadow: 0 0 0 3px rgba(245, 195, 106, 0.16); }
    .dot.off { background: #8b9199; box-shadow: none; }
    .panel {
      background: var(--shell);
      border-left: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 48px 40px;
    }
    form {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .form-title {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .form-copy {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 8px;
    }
    .field { margin-bottom: 16px; }
    .field:last-of-type { margin-bottom: 22px; }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #16181d;
      color: #f4f6f8;
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
      outline: none;
      cursor: text;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.32); }
    input:hover { border-color: rgba(255, 255, 255, 0.16); }
    input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 200, 247, 0.22);
    }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 44px; }
    .eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      border-radius: 8px;
    }
    .eye:hover,
    .eye:focus-visible { color: #fff; }
    .eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button[type="submit"] {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #071018;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:active { transform: scale(0.97); }
    button[type="submit"]:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button[type="submit"]:active { transform: none; }
    }
    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; }
      .hero { min-height: 42vh; }
      .panel { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="hero" aria-label="Venue">
      <img class="logo" src="zonemaestro-logo-blend.png?v=5" alt="ZoneMaestro" width="268" height="147" />
      <div class="hero-copy">
        <div class="lede">
          <h1>Music that moves<br />with your space</h1>
          <p class="sub">Run the library, zones, and MusicServers from one desk. Playback keeps going when a venue goes offline.</p>
          <div class="zones" aria-label="Zone status">
            <span><i class="dot"></i><b>Dining Room</b> live</span>
            <span><i class="dot"></i><b>The Bar</b> live</span>
            <span><i class="dot hold"></i><b>Kitchen</b> hold</span>
            <span><i class="dot off"></i><b>Terrace</b> offline</span>
          </div>
        </div>
      </div>
    </section>
    <aside class="panel">
      <form action="#" method="post">
        <h2 class="form-title">Sign in</h2>
        <p class="form-copy">Group operators and venue administrators.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="ops@group.example" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pass-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button class="eye" type="button" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </aside>
  </main>
</body>
</html>
